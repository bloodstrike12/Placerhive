<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Application | PLACERHIVE</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body>{% include '_nav.html' %}<main class="form-section"><div class="form-container"><span class="eyebrow">APPLICATION TRACKER</span><h1>Track your application</h1><p class="form-desc">Enter the application reference you received after submitting your profile.</p><form id="trackForm"><div class="form-group"><label>Application reference</label><input name="id" type="number" min="1" required placeholder="e.g. 12"></div><button class="btn btn-primary full">Check status</button></form><div id="trackResult"></div></div></main><footer class="footer"><div class="footer-bottom">© 2026 PLACERHIVE</div></footer><script>document.getElementById('trackForm').addEventListener('submit',async e=>{e.preventDefault();const id=new FormData(e.target).get('id');const box=document.getElementById('trackResult');box.innerHTML='Checking...';const r=await fetch('/api/application/'+id);const d=await r.json();if(!r.ok||!d.ok){box.innerHTML='<p class="error-text">'+(d.error||'Application not found.')+'</p>';return}const a=d.application;box.innerHTML='<div class="status-card"><h3>'+a.job_title+'</h3><p>'+a.full_name+' · '+a.location+'</p><p><strong>Status:</strong> <span class="status '+a.status+'">'+a.status+'</span></p><p class="muted">Submitted: '+a.created_at+'</p></div>'})</script><script src="{{ url_for('static',filename='js/main.js') }}"></script></body></html>
