<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | PLACERHIVE</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body>{% include '_nav.html' %}<main class="account-page"><div class="account-card"><span class="eyebrow">MY ACCOUNT</span><h1>{{ current_user.full_name }}</h1><p>{{ current_user.email }}{% if current_user.phone %} · {{ current_user.phone }}{% endif %}</p><div id="myApps" class="account-apps">Loading applications...</div></div></main><script>fetch('/api/application/mine').then(r=>r.json()).then(d=>{const b=document.getElementById('myApps');b.innerHTML=d.applications.length?d.applications.map(a=>`<div class="account-app"><strong>${a.job_title}</strong><span>${a.location}</span><b class="status ${a.status}">${a.status}</b><small>Application #${a.id}</small></div>`).join(''):'<p class="muted">You have not submitted an application yet.</p>'})</script><script src="{{ url_for('static',filename='js/main.js') }}"></script></body></html>
