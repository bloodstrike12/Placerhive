<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Founder — PLACERHIVE</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .founder-hero {
      max-width: 960px;
      margin: 2rem auto;
      padding: 1.5rem;
    }
    .founder-photo {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.18);
      background: #1a1a1a;
    }
    .founder-name {
      font-size: 2rem;
      margin: 1.5rem 0 .25rem;
      color: #c9a227;
    }
    .founder-title {
      color: #888;
      margin-bottom: 1.25rem;
      font-size: 1.1rem;
    }
    .founder-bio {
      line-height: 1.75;
      font-size: 1.05rem;
      color: #ddd;
      white-space: pre-wrap;
    }
    .placeholder-photo {
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
      border-radius: 16px;
      color: #666;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  {% include '_nav.html' %}
  <main class="founder-hero">
    {% if founder_photo %}
      <img class="founder-photo" src="{{ founder_photo }}" alt="{{ founder_name }}" />
    {% else %}
      <div class="placeholder-photo">Founder photo coming soon</div>
    {% endif %}
    <h1 class="founder-name">{{ founder_name }}</h1>
    <p class="founder-title">{{ founder_title }}</p>
    <div class="founder-bio">{{ founder_bio }}</div>
  </main>
  <script src="/static/js/main.js"></script>
</body>
</html>
